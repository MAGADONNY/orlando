<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORLANDO MAGIC SHOW</title>
    
    <!-- Meta tagovi protiv keširanja -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0711;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #d4af37;
            margin: 30px 0;
            letter-spacing: 2px;
        }

        /* Stil za galeriju sa 5 slika u jednom redu */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery-row {
            display: flex;
            width: 100%;
            gap: 10px; /* Razmak između slika */
            justify-content: space-between;
            align-items: center;
        }

        .gallery-row img {
            flex: 1;
            width: 0;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }

        /* Prilagođavanje za manje ekrane (mobitele) */
        @media (max-width: 768px) {
            .gallery-row {
                flex-wrap: wrap;
            }
            .gallery-row img {
                flex: 1 1 45%; /* Na mobilnom po 2 slike u redu */
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <h1>ORLANDO MAGIC SHOW</h1>

    <!-- Sekcija sa 5 slika u jednoj liniji preko širine stranice -->
    <div class="gallery-container">
        <div class="gallery-row">
            <img src="slika1.jpg" alt="Magic Show 1">
            <img src="slika2.jpg" alt="Magic Show 2">
            <img src="slika3.jpg" alt="Magic Show 3">
            <img src="slika4.jpg" alt="Magic Show 4">
            <img src="slika5.jpg" alt="Magic Show 5">
        </div>
    </div>

</body>
</html>
